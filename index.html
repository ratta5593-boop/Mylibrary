<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>آن لائن کتب خانہ - عطاء الرحمٰن عطاء</title>
  <style>
    body {
      background-color: #fcfbfa;
      margin: 0;
      padding: 0;
      font-family: 'Noto Nastaliq Urdu', Arial, sans-serif;
      direction: rtl;
      text-align: right;
    }
    .books-page-wrapper {
      max-width: 900px;
      margin: 20px auto;
      padding: 0 20px;
    }
    .books-nav-bar {
      display: flex;
      justify-content: space-between;
      margin-bottom: 25px;
      font-size: 14px;
      font-weight: bold;
    }
    .books-nav-bar a, .back-to-lib-btn {
      background: #1c3829;
      color: #fff;
      padding: 8px 16px;
      border-radius: 4px;
      text-decoration: none;
      border: none;
      cursor: pointer;
    }
    .books-nav-bar a:hover, .back-to-lib-btn:hover {
      background: #b38b4d;
    }
    .books-header-title {
      text-align: center;
      margin-bottom: 30px;
      background: #ffffff;
      padding: 20px;
      border-radius: 8px;
      border: 1px solid #e0dbd1;
    }
    .books-header-title h1 {
      font-size: 26px;
      color: #1c3829;
      margin-bottom: 8px;
    }
    .books-header-title p {
      font-size: 13px;
      color: #666;
    }
    .books-grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 25px;
    }
    .book-card-item {
      background: #fff;
      border: 1px solid #e0dbd1;
      border-radius: 8px;
      padding: 15px;
      text-align: center;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 10px rgba(0,0,0,0.03);
    }
    .book-card-item:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
      border-color: #b38b4d;
    }
    .book-cover-box img {
      width: 100%;
      height: 280px;
      object-fit: cover;
      border-radius: 4px;
      margin-bottom: 12px;
      pointer-events: none;
    }
    .book-card-item h3 {
      font-size: 18px;
      color: #1c3829;
      margin: 0 0 5px 0;
    }
    .book-card-item p {
      font-size: 12px;
      color: #b38b4d;
      margin: 0;
      font-weight: 600;
    }
    .secure-book-container {
      background: #fff;
      border: 1px solid #dcd6cd;
      border-radius: 8px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }
    .book-page-view img {
      max-width: 100%;
      height: 450px;
      object-fit: contain;
      border: 1px solid #eee;
      pointer-events: none;
    }
    .book-controls-bar {
      margin-top: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
    }
    .book-controls-bar button {
      background: #1c3829;
      color: #fff;
      border: none;
      padding: 8px 18px;
      border-radius: 4px;
      cursor: pointer;
    }
    .book-controls-bar button:hover {
      background: #b38b4d;
    }
    #pageIndicator {
      font-size: 14px;
      font-weight: bold;
      color: #333;
    }
  </style>
</head>
<body>

<div class="books-page-wrapper">
  <!-- ٹاپ نیویگیشن -->
  <div class="books-nav-bar">
    <a href="https://attaurrehman-atta.blogspot.com/p/home.html">صفحہ اول (Home)</a>
  </div>

  <!-- ویو 1: لائبریری لسٹ -->
  <div id="libraryView" class="library-view-section">
    <div class="books-header-title">
      <h1>آن لائن کتب خانہ</h1>
      <p>مطالعہ کے لیے نیچے دی گئی کتب میں سے کسی کتاب پر کلک کریں</p>
    </div>

    <div class="books-grid-container">
      
      <!-- کتاب 1 -->
      <div class="book-card-item" onclick="openBook(0)">
        <div class="book-cover-box">
          <img src="https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?auto=format&fit=crop&w=400&q=80" alt="Book Cover">
        </div>
        <h3>تحقیقی مقالات</h3>
        <p>مصنف: عطاء الرحمٰن عطاء</p>
      </div>

      <!-- کتاب 2 -->
      <div class="book-card-item" onclick="openBook(1)">
        <div class="book-cover-box">
          <img src="https://images.unsplash.com/photo-1512820790803-83ca734da794?auto=format&fit=crop&w=400&q=80" alt="Book Cover">
        </div>
        <h3>تنقیدی زاویے</h3>
        <p>مصنف: عطاء الرحمٰن عطاء</p>
      </div>

    </div>
  </div>

  <!-- ویو 2: کتاب کا ریڈر -->
  <div id="readerView" class="reader-view-section" style="display: none;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
      <button class="back-to-lib-btn" onclick="closeBook()">← تمام کتب کی طرف واپس</button>
      <h2 id="activeBookTitle" style="font-size: 20px; color: #1c3829; margin: 0;">کتاب کا نام</h2>
    </div>

    <div class="secure-book-container">
      <div class="book-page-view">
        <img id="bookPageImg" src="" alt="Book Page" draggable="false">
      </div>
      
      <div class="book-controls-bar">
        <button onclick="prevPage()">← پچھلا صفحہ</button>
        <span id="pageIndicator">صفحہ 1 / 2</span>
        <button onclick="nextPage()">اگلا صفحہ →</button>
      </div>
    </div>
  </div>

</div>

<script>
  const libraryBooks = [
    {
      title: "تحقیقی مقالات",
      pages: [
        "https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?auto=format&fit=crop&w=800&q=80",
        "https://images.unsplash.com/photo-1512820790803-83ca734da794?auto=format&fit=crop&w=800&q=80"
      ]
    },
    {
      title: "تنقیدی زاویے",
      pages: [
        "https://images.unsplash.com/photo-1512820790803-83ca734da794?auto=format&fit=crop&w=800&q=80",
        "https://images.unsplash.com/photo-1497633762265-9d179a990aa6?auto=format&fit=crop&w=800&q=80"
      ]
    }
  ];

  let currentBookIndex = 0;
  let currentPageIndex = 0;

  function openBook(bookIndex) {
    currentBookIndex = bookIndex;
    currentPageIndex = 0;
    document.getElementById('libraryView').style.display = 'none';
    document.getElementById('readerView').style.display = 'block';
    document.getElementById('activeBookTitle').innerText = libraryBooks[bookIndex].title;
    updatePage();
  }

  function closeBook() {
    document.getElementById('readerView').style.display = 'none';
    document.getElementById('libraryView').style.display = 'block';
  }

  function updatePage() {
    const book = libraryBooks[currentBookIndex];
    document.getElementById('bookPageImg').src = book.pages[currentPageIndex];
    document.getElementById('pageIndicator').innerText = "صفحہ " + (currentPageIndex + 1) + " / " + book.pages.length;
  }

  function nextPage() {
    const book = libraryBooks[currentBookIndex];
    if (currentPageIndex < book.pages.length - 1) {
      currentPageIndex++;
      updatePage();
    }
  }

  function prevPage() {
    if (currentPageIndex > 0) {
      currentPageIndex--;
      updatePage();
    }
  }

  document.addEventListener('contextmenu', e => e.preventDefault());
</script>

</body>
</html>
