<!DOCTYPE html>
<html lang="ur" dir="rtl" id="htmlTag">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title id="docTitle">آن لائن کتب خانہ - عطاء الرحمٰن عطاء</title>

  <!-- PDF.js لائبریری -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

  <style>
    @media print { body { display: none !important; } }

    body {
      background-color: #f4f0eb;
      margin: 0;
      padding: 0;
      font-family: 'Noto Nastaliq Urdu', Arial, sans-serif;
      direction: rtl;
      text-align: right;
      color: #1c3829;
      user-select: none;
      -webkit-user-select: none;
    }

    .books-page-wrapper {
      max-width: 900px;
      margin: 20px auto;
      padding: 0 20px;
    }

    .books-nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      gap: 10px;
      flex-wrap: wrap;
    }

    .nav-btn {
      background: #1c3829;
      color: #ffffff;
      padding: 8px 16px;
      border-radius: 6px;
      text-decoration: none;
      border: none;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .nav-btn:hover { background: #b89762; }
    .btn-danger { background: #a33; }
    .btn-danger:hover { background: #700; }
    .btn-gold { background: #b89762; }
    .btn-gold:hover { background: #1c3829; }

    .admin-panel {
      background: #ffffff;
      border: 1px solid #e2dad0;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 25px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal-box {
      background: #fff;
      padding: 25px;
      border-radius: 12px;
      width: 90%;
      max-width: 360px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.2);
    }

    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
    .form-group input {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 14px;
    }

    .books-header-title {
      text-align: center;
      margin-bottom: 30px;
      background: #ffffff;
      padding: 25px;
      border-radius: 12px;
      border: 1px solid #e2dad0;
    }

    .books-grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 25px;
    }

    .book-card-item {
      background: #ffffff;
      border: 1px solid #e2dad0;
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.02);
      position: relative;
    }

    .book-card-item:hover { border-color: #b89762; }
    .book-cover-box { cursor: pointer; }
    .book-cover-box img {
      width: 100%;
      height: 280px;
      object-fit: cover;
      border-radius: 6px;
      margin-bottom: 12px;
      pointer-events: none;
    }

    .delete-btn {
      margin-top: 10px;
      width: 100%;
      justify-content: center;
    }

    .secure-book-container {
      background: #ffffff;
      border: 1px solid #e2dad0;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      position: relative;
      overflow: hidden;
      touch-action: none;
    }

    .secure-book-container:fullscreen {
      background: #f4f0eb;
      padding: 10px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .book-page-wrapper {
      position: relative;
      display: inline-block;
      max-width: 100%;
      margin: 0 auto;
      overflow: hidden;
    }

    .book-page-view canvas {
      max-width: 100%;
      height: auto;
      max-height: 550px;
      border: 1px solid #eee;
      pointer-events: none;
      transform-origin: center center;
      transition: transform 0.1s ease-out;
    }

    /* ریڈنگ ویو میں ہر صفحے پر ایک بار شفاف نیلا واٹرمارک */
    .single-page-watermark {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(-30deg);
      font-size: 42px;
      font-weight: bold;
      color: rgba(0, 102, 204, 0.22); /* ٹرانسپیرینٹ بلیو */
      pointer-events: none;
      z-index: 5;
      white-space: nowrap;
      user-select: none;
    }

    /* سکرین شارٹ / پروٹیکشن اوورلے - بلر اور 500 بار واٹرمارک */
    .screenshot-protection-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      z-index: 99999;
      overflow: hidden;
      justify-content: center;
      align-items: center;
    }

    .watermark-500-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-around;
      align-content: space-around;
      width: 140%;
      height: 140%;
      transform: rotate(-20deg);
    }

    .watermark-500-item {
      font-size: 12px;
      font-weight: bold;
      color: rgba(0, 102, 204, 0.6);
      margin: 8px 12px;
      white-space: nowrap;
    }

    body.blur-protected .screenshot-protection-overlay {
      display: flex !important;
    }

    body.blur-protected .books-page-wrapper {
      filter: blur(30px) !important;
    }

    .book-controls-bar {
      margin-top: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .page-input-box {
      width: 50px;
      text-align: center;
      padding: 4px;
      border: 1px solid #b89762;
      border-radius: 4px;
      font-weight: bold;
    }
  </style>
</head>
<body>

<!-- سکرین شارٹ اوورلے (500 بار واٹرمارک اور بلر کے لیے) -->
<div class="screenshot-protection-overlay" id="protectionOverlay">
  <div class="watermark-500-grid" id="watermark500Grid"></div>
</div>

<div class="books-page-wrapper">
  
  <!-- نیویگیشن بار -->
  <div class="books-nav-bar">
    <a href="https://attaurrehman-atta.blogspot.com/p/home.html" class="nav-btn" id="homeBtn">صفحہ اول (Home)</a>
    
    <!-- ایڈمن کنٹرولز -->
    <div id="adminNavControls" style="display: none;">
      <button class="nav-btn btn-gold" onclick="toggleUploadPanel()">+ کتاب اپلوڈ کریں</button>
      <button class="nav-btn" onclick="toggleSettingsPanel()">⚙ سیٹنگز</button>
      <button class="nav-btn btn-danger" onclick="adminLogout()">لاگ آؤٹ</button>
    </div>

    <div>
      <button class="nav-btn" id="backToLibBtn" onclick="closeBook()" style="display: none;">← تمام کتب</button>
    </div>
  </div>

  <!-- لاگ ان پاپ اپ ماڈل -->
  <div id="loginModal" class="modal-overlay" style="display: none;">
    <div class="modal-box">
      <h3 style="margin-top:0; color:#1c3829; text-align:center;">ایڈمن لاگ ان</h3>
      <div class="form-group">
        <label>یوزر نیم (Username):</label>
        <input type="text" id="loginUser" placeholder="یوزر نیم درج کریں">
      </div>
      <div class="form-group">
        <label>پاسورڈ (Password):</label>
        <input type="password" id="loginPass" placeholder="پاسورڈ درج کریں">
      </div>
      <div style="display:flex; justify-content:space-between; gap:10px;">
        <button class="nav-btn" onclick="processLogin()">لاگ ان کریں</button>
        <button class="nav-btn btn-danger" onclick="cancelLogin()">منسوخ</button>
      </div>
    </div>
  </div>

  <!-- ایڈمن اپلوڈ فارم -->
  <div id="uploadPanel" class="admin-panel" style="display: none;">
    <h3>نئی کتاب اپلوڈ کریں</h3>
    <div class="form-group">
      <label>کتاب کا نام (اردو):</label>
      <input type="text" id="bookTitleUr" placeholder="مثال: تحقیقی مقالات">
    </div>
    <div class="form-group">
      <label>کتاب کا نام (English):</label>
      <input type="text" id="bookTitleEn" placeholder="Example: Research Papers">
    </div>
    <div class="form-group">
      <label>کتاب کا کور (Cover Image):</label>
      <input type="file" id="coverFileInput" accept="image/*">
      <input type="text" id="coverUrlInput" placeholder="یا امیج کا لنک (URL) درج کریں" style="margin-top: 5px;">
    </div>
    <div class="form-group">
      <label>کتاب کی پی ڈی ایف (PDF File):</label>
      <input type="file" id="pdfFileInput" accept="application/pdf">
      <input type="text" id="pdfUrlInput" placeholder="یا پی ڈی ایف فائل کا لنک (URL) درج کریں" style="margin-top: 5px;">
    </div>
    <button class="nav-btn" id="saveBookBtn" onclick="saveNewBookFast()">محفوظ کریں</button>
    <button class="nav-btn btn-danger" onclick="toggleUploadPanel()">بند کریں</button>
  </div>

  <!-- ایڈمن سیٹنگز فارم -->
  <div id="settingsPanel" class="admin-panel" style="display: none;">
    <h3>یوزر نیم اور پاسورڈ تبدیل کریں</h3>
    <div class="form-group">
      <label>نیا یوزر نیم (New Username):</label>
      <input type="text" id="newUsername" placeholder="نیا یوزر نیم لکھیں">
    </div>
    <div class="form-group">
      <label>نیا پاسورڈ (New Password):</label>
      <input type="password" id="newPassword" placeholder="نیا پاسورڈ لکھیں">
    </div>
    <button class="nav-btn" onclick="updateCredentials()">سیٹنگز اپ ڈیٹ کریں</button>
    <button class="nav-btn btn-danger" onclick="toggleSettingsPanel()">بند کریں</button>
  </div>

  <!-- لائبریری ویو -->
  <div id="libraryView">
    <div class="books-header-title">
      <h1 id="libTitle">آن لائن کتب خانہ</h1>
      <p id="libSubtitle">مطالعہ کے لیے نیچے دی گئی کتب میں سے کسی کتاب پر کلک کریں</p>
    </div>
    <div class="books-grid-container" id="booksGrid"></div>
  </div>

  <!-- بک ریڈر -->
  <div id="readerView" style="display: none;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
      <h2 id="activeBookTitle" style="font-size: 20px; color: #1c3829; margin: 0;">کتاب کا نام</h2>
      <button class="nav-btn" onclick="toggleFullScreen()">⤢ فل سکرین</button>
    </div>

    <div class="secure-book-container" id="swipeArea">
      <div class="book-page-wrapper">
        <div class="book-page-view" id="pageViewer"></div>
        <!-- ہر صفحے پر ایک شفاف نیلا واٹرمارک -->
        <div class="single-page-watermark">عطاء لائبریری</div>
      </div>
      
      <div class="book-controls-bar">
        <button class="nav-btn" id="prevBtn" onclick="prevPage()">← پچھلا</button>

        <div style="font-size: 14px; font-weight: bold;">
          صفحہ <input type="number" id="pageInput" class="page-input-box" min="1" onchange="jumpToPage(this.value)"> 
          / <span id="totalPages">1</span>
        </div>

        <button class="nav-btn" id="nextBtn" onclick="nextPage()">اگلا →</button>
      </div>
    </div>
  </div>

</div>

<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

  let db;
  const request = indexedDB.open("FastLibraryDB", 2);
  request.onupgradeneeded = function(e) {
    db = e.target.result;
    if (!db.objectStoreNames.contains("books")) {
      db.createObjectStore("books", { keyPath: "id", autoIncrement: true });
    }
  };
  request.onsuccess = function(e) {
    db = e.target.result;
    renderLibrary();
  };

  let adminCreds = JSON.parse(localStorage.getItem('adminCredentials')) || {
    username: "admin",
    password: "1234"
  };

  let currentLang = 'ur';
  let activeBookList = [];
  let currentBookIndex = 0;
  let currentPageIndex = 1;
  let pdfDoc = null;

  // 500 مرتبہ واٹرمارک جنریٹ کرنے کا فنکشن (سکرین شارٹ پروٹیکشن کے لیے)
  function init500Watermarks() {
    const grid = document.getElementById('watermark500Grid');
    grid.innerHTML = '';
    for (let i = 0; i < 500; i++) {
      const span = document.createElement('span');
      span.className = 'watermark-500-item';
      span.innerText = 'عطاء لائبریری';
      grid.appendChild(span);
    }
  }
  init500Watermarks();

  function checkHashAndAuth() {
    const currentHash = window.location.hash.toLowerCase();
    const isHashAdmin = (currentHash === '#admin');
    const isLoggedInSession = sessionStorage.getItem('isAdminLoggedIn') === 'true';

    if (isHashAdmin) {
      if (isLoggedInSession) {
        document.getElementById('adminNavControls').style.display = 'inline-flex';
        document.getElementById('loginModal').style.display = 'none';
      } else {
        document.getElementById('adminNavControls').style.display = 'none';
        document.getElementById('loginModal').style.display = 'flex';
      }
    } else {
      sessionStorage.removeItem('isAdminLoggedIn');
      document.getElementById('adminNavControls').style.display = 'none';
      document.getElementById('uploadPanel').style.display = 'none';
      document.getElementById('settingsPanel').style.display = 'none';
      document.getElementById('loginModal').style.display = 'none';
    }
    renderLibrary();
  }

  window.addEventListener('hashchange', checkHashAndAuth);
  window.addEventListener('load', checkHashAndAuth);

  function processLogin() {
    const u = document.getElementById('loginUser').value;
    const p = document.getElementById('loginPass').value;

    if (u === adminCreds.username && p === adminCreds.password) {
      sessionStorage.setItem('isAdminLoggedIn', 'true');
      alert('لاگ ان کامیاب رہا!');
      checkHashAndAuth();
    } else {
      alert('غلط یوزر نیم یا پاسورڈ!');
    }
  }

  function cancelLogin() {
    window.location.hash = '';
    checkHashAndAuth();
  }

  function adminLogout() {
    sessionStorage.removeItem('isAdminLoggedIn');
    window.location.hash = '';
    alert('آپ لاگ آؤٹ ہو چکے ہیں!');
    checkHashAndAuth();
  }

  function toggleUploadPanel() {
    const p = document.getElementById('uploadPanel');
    document.getElementById('settingsPanel').style.display = 'none';
    p.style.display = p.style.display === 'none' ? 'block' : 'none';
  }

  function toggleSettingsPanel() {
    const p = document.getElementById('settingsPanel');
    document.getElementById('uploadPanel').style.display = 'none';
    if (p.style.display === 'none') {
      document.getElementById('newUsername').value = adminCreds.username;
      document.getElementById('newPassword').value = adminCreds.password;
      p.style.display = 'block';
    } else {
      p.style.display = 'none';
    }
  }

  function updateCredentials() {
    const newU = document.getElementById('newUsername').value;
    const newP = document.getElementById('newPassword').value;

    if (!newU || !newP) {
      alert('یوزر نیم اور پاسورڈ خالی نہیں ہو سکتے!');
      return;
    }

    adminCreds.username = newU;
    adminCreds.password = newP;
    localStorage.setItem('adminCredentials', JSON.stringify(adminCreds));
    alert('یوزر نیم اور پاسورڈ کامیابی سے تبدیل ہو گیا!');
    toggleSettingsPanel();
  }

  async function saveNewBookFast() {
    const titleUr = document.getElementById('bookTitleUr').value;
    const titleEn = document.getElementById('bookTitleEn').value;
    const coverFile = document.getElementById('coverFileInput').files[0];
    const coverUrl = document.getElementById('coverUrlInput').value;
    const pdfFile = document.getElementById('pdfFileInput').files[0];
    const pdfUrl = document.getElementById('pdfUrlInput').value;

    if (!titleUr) { alert('کتاب کا نام لکھنا ضروری ہے'); return; }

    const saveBtn = document.getElementById('saveBookBtn');
    saveBtn.innerText = 'محفوظ ہو رہا ہے...';
    saveBtn.disabled = true;

    let finalCover = coverUrl;
    if (coverFile) {
      finalCover = await readFileAsDataURL(coverFile);
    }

    let pdfBlob = null;
    if (pdfFile) {
      pdfBlob = pdfFile;
    } else if (pdfUrl) {
      pdfBlob = pdfUrl;
    } else { 
      alert('پی ڈی ایف فائل یا لنک شامل کریں');
      saveBtn.innerText = 'محفوظ کریں';
      saveBtn.disabled = false;
      return; 
    }

    let bookData = {
      titleUr: titleUr,
      titleEn: titleEn || titleUr,
      cover: finalCover || 'https://via.placeholder.com/300x400?text=No+Cover',
      pdfBlob: pdfBlob
    };

    const transaction = db.transaction(["books"], "readwrite");
    const store = transaction.objectStore("books");
    store.add(bookData);

    transaction.oncomplete = function() {
      alert('کتاب کامیابی سے اپلوڈ ہو گئی!');
      saveBtn.innerText = 'محفوظ کریں';
      saveBtn.disabled = false;
      document.getElementById('bookTitleUr').value = '';
      document.getElementById('bookTitleEn').value = '';
      document.getElementById('pdfFileInput').value = '';
      document.getElementById('coverFileInput').value = '';
      toggleUploadPanel();
      renderLibrary();
    };
  }

  function readFileAsDataURL(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function renderLibrary() {
    if (!db) return;
    const grid = document.getElementById('booksGrid');
    grid.innerHTML = '';

    const transaction = db.transaction(["books"], "readonly");
    const store = transaction.objectStore("books");
    const getAll = store.getAll();

    getAll.onsuccess = function() {
      activeBookList = getAll.result;
      const isAdminLoggedIn = sessionStorage.getItem('isAdminLoggedIn') === 'true';
      const isHashAdmin = window.location.hash.toLowerCase() === '#admin';

      if(activeBookList.length === 0) {
        grid.innerHTML = `<p style="text-align:center; grid-column: 1/-1;">کوئی کتاب موجود نہیں ہے۔</p>`;
        return;
      }

      activeBookList.forEach((book, index) => {
        const card = document.createElement('div');
        card.className = 'book-card-item';
        
        let deleteBtnHTML = '';
        if (isAdminLoggedIn && isHashAdmin) {
          deleteBtnHTML = `<button class="nav-btn btn-danger delete-btn" onclick="deleteBook(${book.id})">🗑 ڈیلیٹ کریں</button>`;
        }

        card.innerHTML = `
          <div class="book-cover-box" onclick="openBook(${index})">
            <img src="${book.cover}" alt="Book Cover">
            <h3>${currentLang === 'ur' ? book.titleUr : book.titleEn}</h3>
          </div>
          ${deleteBtnHTML}
        `;
        grid.appendChild(card);
      });
    };
  }

  function deleteBook(id) {
    if (confirm("کیا آپ واقعی اس کتاب کو ڈیلیٹ کرنا چاہتے ہیں؟")) {
      const transaction = db.transaction(["books"], "readwrite");
      const store = transaction.objectStore("books");
      store.delete(id);
      transaction.oncomplete = function() {
        alert("کتاب کامیابی سے ڈیلیٹ کر دی گئی!");
        renderLibrary();
      };
    }
  }

  async function openBook(index) {
    currentBookIndex = index;
    currentPageIndex = 1;
    currentScale = 1.0;
    const book = activeBookList[index];

    document.getElementById('libraryView').style.display = 'none';
    document.getElementById('readerView').style.display = 'block';
    document.getElementById('backToLibBtn').style.display = 'inline-flex';
    document.getElementById('activeBookTitle').innerText = currentLang === 'ur' ? book.titleUr : book.titleEn;

    let pdfData;
    if (typeof book.pdfBlob === 'string') {
      pdfData = book.pdfBlob;
    } else {
      const arrayBuffer = await book.pdfBlob.arrayBuffer();
      pdfData = new Uint8Array(arrayBuffer);
    }

    const loadingTask = pdfjsLib.getDocument({ data: pdfData });
    pdfDoc = await loadingTask.promise;
    document.getElementById('totalPages').innerText = pdfDoc.numPages;
    renderPdfPage(currentPageIndex);
  }

  async function renderPdfPage(num) {
    const page = await pdfDoc.getPage(num);
    const viewport = page.getViewport({ scale: 1.5 });

    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    canvas.height = viewport.height;
    canvas.width = viewport.width;

    const viewer = document.getElementById('pageViewer');
    viewer.innerHTML = '';
    viewer.appendChild(canvas);

    await page.render({ canvasContext: ctx, viewport: viewport }).promise;
    document.getElementById('pageInput').value = num;
    applyZoom();
  }

  function jumpToPage(val) {
    let pageNum = parseInt(val);
    let max = pdfDoc ? pdfDoc.numPages : 1;
    
    if (pageNum >= 1 && pageNum <= max) {
      currentPageIndex = pageNum;
      renderPdfPage(currentPageIndex);
    }
  }

  function nextPage() {
    if (currentPageIndex < pdfDoc.numPages) {
      currentPageIndex++;
      renderPdfPage(currentPageIndex);
    }
  }

  function prevPage() {
    if (currentPageIndex > 1) {
      currentPageIndex--;
      renderPdfPage(currentPageIndex);
    }
  }

  function toggleFullScreen() {
    const container = document.getElementById('swipeArea');
    if (!document.fullscreenElement) {
      container.requestFullscreen().catch(err => alert("فل سکرین فعال نہیں ہو سکی"));
    } else {
      document.exitFullscreen();
    }
  }

  function closeBook() {
    document.getElementById('readerView').style.display = 'none';
    document.getElementById('libraryView').style.display = 'block';
    document.getElementById('backToLibBtn').style.display = 'none';
  }

  // --- ٹچ سوائپ (آگے/پیچھے) اور پنچ زوم (In/Out) ---
  const swipeContainer = document.getElementById('swipeArea');
  let startX = 0, startY = 0;
  let initialPinchDistance = null;
  let currentScale = 1.0;

  swipeContainer.addEventListener('touchstart', function(e) {
    if (e.touches.length === 1) {
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
    } else if (e.touches.length === 2) {
      initialPinchDistance = getPinchDistance(e);
    }
  }, { passive: true });

  swipeContainer.addEventListener('touchmove', function(e) {
    if (e.touches.length === 2 && initialPinchDistance) {
      const newDistance = getPinchDistance(e);
      const zoomFactor = newDistance / initialPinchDistance;
      
      if (zoomFactor > 1.03 && currentScale < 2.5) {
        currentScale += 0.04;
        applyZoom();
      } else if (zoomFactor < 0.97 && currentScale > 0.8) {
        currentScale -= 0.04;
        applyZoom();
      }
      initialPinchDistance = newDistance;
    }
  }, { passive: true });

  swipeContainer.addEventListener('touchend', function(e) {
    if (e.changedTouches.length === 1 && currentScale === 1.0) {
      let endX = e.changedTouches[0].clientX;
      let endY = e.changedTouches[0].clientY;

      let diffX = startX - endX;
      let diffY = startY - endY;

      // انگلی بائیں/دائیں کرنے سے صفحہ تبدیل ہونا
      if (Math.abs(diffX) > 40 && Math.abs(diffY) < 50) {
        if (diffX > 0) {
          nextPage(); // انگلی بائیں کرنے پر اگلا صفحہ
        } else {
          prevPage(); // انگلی دائیں کرنے پر پچھلا صفحہ
        }
      }
    }
    initialPinchDistance = null;
  });

  function getPinchDistance(e) {
    return Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
  }

  function applyZoom() {
    const canvas = document.querySelector('.book-page-view canvas');
    if (canvas) {
      canvas.style.transform = `scale(${currentScale})`;
    }
  }

  // --- سکرین شارٹ / ونڈو چینج پروٹیکشن (بلر اور 500 بار واٹرمارک) ---
  document.addEventListener('contextmenu', e => e.preventDefault());

  window.addEventListener('blur', () => {
    document.body.classList.add('blur-protected');
  });

  window.addEventListener('focus', () => {
    document.body.classList.remove('blur-protected');
  });

  // PrintScreen بٹن دبانے پر بلر کریں
  window.addEventListener('keyup', (e) => {
    if (e.key === 'PrintScreen') {
      document.body.classList.add('blur-protected');
      setTimeout(() => {
        document.body.classList.remove('blur-protected');
      }, 3000);
    }
  });

  checkHashAndAuth();
</script>

</body>
</html>
