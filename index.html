<!DOCTYPE html>
<html lang="ur" dir="rtl" id="htmlTag">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="docTitle">آن لائن کتب خانہ - عطاء الرحمٰن عطاء</title>
  <style>
    /* پرنٹنگ اور اسکرین شاٹ کی روک تھام کے لیے */
    @media print {
      body { display: none !important; }
    }

    /* سیکیورٹی کے لیے بلر کیپچر */
    .blur-protected {
      filter: blur(15px) !important;
      user-select: none !important;
    }

    body {
      background-color: #fcfbfa;
      margin: 0;
      padding: 0;
      font-family: 'Noto Nastaliq Urdu', Arial, sans-serif;
      direction: rtl;
      text-align: right;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }

    .books-page-wrapper {
      max-width: 900px;
      margin: 20px auto;
      padding: 0 20px;
    }

    /* ایک ہی لائن میں نیویگیشن اور ایکشن بٹنز */
    .books-nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      gap: 10px;
    }

    .nav-btn {
      background: #1c3829;
      color: #fff;
      padding: 8px 16px;
      border-radius: 4px;
      text-decoration: none;
      border: none;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: background 0.2s;
    }

    .nav-btn:hover {
      background: #b38b4d;
    }

    .books-header-title {
      text-align: center;
      margin-bottom: 30px;
      background: #ffffff;
      padding: 20px;
      border-radius: 8px;
      border: 1px solid #e0dbd1;
    }

    .books-header-title h1 {
      font-size: 26px;
      color: #1c3829;
      margin-bottom: 8px;
    }

    .books-header-title p {
      font-size: 13px;
      color: #666;
    }

    .books-grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 25px;
    }

    .book-card-item {
      background: #fff;
      border: 1px solid #e0dbd1;
      border-radius: 8px;
      padding: 15px;
      text-align: center;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 10px rgba(0,0,0,0.03);
    }

    .book-card-item:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
      border-color: #b38b4d;
    }

    .book-cover-box img {
      width: 100%;
      height: 280px;
      object-fit: cover;
      border-radius: 4px;
      margin-bottom: 12px;
      pointer-events: none;
    }

    .book-card-item h3 {
      font-size: 18px;
      color: #1c3829;
      margin: 0 0 5px 0;
    }

    .book-card-item p {
      font-size: 12px;
      color: #b38b4d;
      margin: 0;
      font-weight: 600;
    }

    .secure-book-container {
      background: #fff;
      border: 1px solid #dcd6cd;
      border-radius: 8px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      touch-action: pan-y;
      overflow: hidden;
    }

    .book-page-view img {
      max-width: 100%;
      height: 450px;
      object-fit: contain;
      border: 1px solid #eee;
      pointer-events: none;
      transition: filter 0.2s;
    }

    .book-controls-bar {
      margin-top: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 10px;
    }

    #pageIndicator {
      font-size: 14px;
      font-weight: bold;
      color: #333;
    }

    /* LTR لے آؤٹ کے لیے مخصوص سیٹنگز */
    [dir="ltr"] body {
      text-align: left;
      font-family: Arial, sans-serif;
    }
    [dir="ltr"] .books-header-title,
    [dir="ltr"] .book-card-item,
    [dir="ltr"] .secure-book-container {
      text-align: center;
    }
  </style>
</head>
<body>

<div class="books-page-wrapper" id="contentWrapper">
  
  <!-- ٹاپ نیویگیشن بار (ایک ہی لائن میں) -->
  <div class="books-nav-bar">
    <a href="https://attaurrehman-atta.blogspot.com/p/home.html" class="nav-btn" id="homeBtn">صفحہ اول (Home)</a>
    <button class="nav-btn" id="backToLibBtn" onclick="closeBook()" style="display: none;">← تمام کتب کی طرف واپس</button>
  </div>

  <!-- ویو 1: لائبریری لسٹ -->
  <div id="libraryView" class="library-view-section">
    <div class="books-header-title">
      <h1 id="libTitle">آن لائن کتب خانہ</h1>
      <p id="libSubtitle">مطالعہ کے لیے نیچے دی گئی کتب میں سے کسی کتاب پر کلک کریں</p>
    </div>

    <div class="books-grid-container" id="booksGrid">
      <!-- کتب کی لسٹ -->
    </div>
  </div>

  <!-- ویو 2: کتاب کا ریڈر -->
  <div id="readerView" class="reader-view-section" style="display: none;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
      <h2 id="activeBookTitle" style="font-size: 20px; color: #1c3829; margin: 0;">کتاب کا نام</h2>
    </div>

    <div class="secure-book-container" id="swipeArea">
      <div class="book-page-view">
        <img id="bookPageImg" src="" alt="Book Page" draggable="false">
      </div>
      
      <div class="book-controls-bar">
        <button class="nav-btn" id="prevBtn" onclick="prevPage()">← پچھلا صفحہ</button>
        <span id="pageIndicator">صفحہ 1 / 2</span>
        <button class="nav-btn" id="nextBtn" onclick="nextPage()">اگلا صفحہ →</button>
      </div>
    </div>
  </div>

</div>

<script>
  let currentLang = 'ur';

  const translations = {
    ur: {
      docTitle: "آن لائن کتب خانہ - عطاء الرحمٰن عطاء",
      homeBtn: "صفحہ اول (Home)",
      backBtn: "← تمام کتب کی طرف واپس",
      libTitle: "آن لائن کتب خانہ",
      libSubtitle: "مطالعہ کے لیے نیچے دی گئی کتب میں سے کسی کتاب پر کلک کریں",
      authorPrefix: "مصنف: ",
      prevBtn: "← پچھلا صفحہ",
      nextBtn: "اگلا صفحہ →",
      pageWord: "صفحہ"
    },
    en: {
      docTitle: "Online Library - Atta ur Rehman Atta",
      homeBtn: "Home",
      backBtn: "← Back to All Books",
      libTitle: "Online Library",
      libSubtitle: "Click on any book below to read",
      authorPrefix: "Author: ",
      prevBtn: "← Previous Page",
      nextBtn: "Next Page →",
      pageWord: "Page"
    }
  };

  const libraryBooks = [
    {
      titleUr: "تحقیقی مقالات",
      titleEn: "Research Papers",
      authorUr: "عطاء الرحمٰن عطاء",
      authorEn: "Atta ur Rehman Atta",
      pages: [
        "https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?auto=format&fit=crop&w=800&q=80",
        "https://images.unsplash.com/photo-1512820790803-83ca734da794?auto=format&fit=crop&w=800&q=80"
      ]
    },
    {
      titleUr: "تنقیدی زاویے",
      titleEn: "Critical Perspectives",
      authorUr: "عطاء الرحمٰن عطاء",
      authorEn: "Atta ur Rehman Atta",
      pages: [
        "https://images.unsplash.com/photo-1512820790803-83ca734da794?auto=format&fit=crop&w=800&q=80",
        "https://images.unsplash.com/photo-1497633762265-9d179a990aa6?auto=format&fit=crop&w=800&q=80"
      ]
    }
  ];

  let currentBookIndex = 0;
  let currentPageIndex = 0;

  // تمام تکنیکوں کے ذریعے بلاگ کی زبان کا پتہ لگانا
  function detectBlogLanguage() {
    let detectedLang = 'ur';

    // 1. HTML attributes چیک کریں
    const htmlElem = document.documentElement;
    const langAttr = (htmlElem.getAttribute('lang') || '').toLowerCase();
    const dirAttr = (htmlElem.getAttribute('dir') || '').toLowerCase();

    // 2. Google Translate کی کوکیز یا کلاسز چیک کریں
    const cookies = document.cookie;
    const isGoogleEng = cookies.includes('googtrans=/ur/en') || cookies.includes('googtrans=/auto/en');
    const bodyClass = document.body.className;

    if (langAttr.startsWith('en') || dirAttr === 'ltr' || isGoogleEng || bodyClass.includes('translated-ltr')) {
      detectedLang = 'en';
    } else {
      detectedLang = 'ur';
    }

    if (currentLang !== detectedLang) {
      currentLang = detectedLang;
      applyLanguageSettings();
    }
  }

  function applyLanguageSettings() {
    const htmlTag = document.documentElement;
    htmlTag.setAttribute('lang', currentLang);
    htmlTag.setAttribute('dir', currentLang === 'ur' ? 'rtl' : 'ltr');

    const t = translations[currentLang];
    document.getElementById('docTitle').innerText = t.docTitle;
    document.getElementById('homeBtn').innerText = t.homeBtn;
    document.getElementById('backToLibBtn').innerText = t.backBtn;
    document.getElementById('libTitle').innerText = t.libTitle;
    document.getElementById('libSubtitle').innerText = t.libSubtitle;
    document.getElementById('prevBtn').innerText = t.prevBtn;
    document.getElementById('nextBtn').innerText = t.nextBtn;

    renderLibrary();
    if (document.getElementById('readerView').style.display === 'block') {
      updateBookTitle();
      updatePage();
    }
  }

  // لائبریری رینڈر کرنا
  function renderLibrary() {
    const grid = document.getElementById('booksGrid');
    grid.innerHTML = '';
    
    libraryBooks.forEach((book, index) => {
      const title = currentLang === 'ur' ? book.titleUr : book.titleEn;
      const author = currentLang === 'ur' ? book.authorUr : book.authorEn;
      
      const card = document.createElement('div');
      card.className = 'book-card-item';
      card.onclick = () => openBook(index);
      card.innerHTML = `
        <div class="book-cover-box">
          <img src="${book.pages[0]}" alt="Book Cover">
        </div>
        <h3>${title}</h3>
        <p>${translations[currentLang].authorPrefix}${author}</p>
      `;
      grid.appendChild(card);
    });
  }

  function openBook(bookIndex) {
    currentBookIndex = bookIndex;
    currentPageIndex = 0;
    document.getElementById('libraryView').style.display = 'none';
    document.getElementById('readerView').style.display = 'block';
    document.getElementById('backToLibBtn').style.display = 'inline-flex';
    
    updateBookTitle();
    updatePage();
  }

  function closeBook() {
    document.getElementById('readerView').style.display = 'none';
    document.getElementById('libraryView').style.display = 'block';
    document.getElementById('backToLibBtn').style.display = 'none';
  }

  function updateBookTitle() {
    const book = libraryBooks[currentBookIndex];
    document.getElementById('activeBookTitle').innerText = currentLang === 'ur' ? book.titleUr : book.titleEn;
  }

  function updatePage() {
    const book = libraryBooks[currentBookIndex];
    document.getElementById('bookPageImg').src = book.pages[currentPageIndex];
    
    const pageText = translations[currentLang].pageWord;
    document.getElementById('pageIndicator').innerText = `${pageText} ${currentPageIndex + 1} / ${book.pages.length}`;
  }

  function nextPage() {
    const book = libraryBooks[currentBookIndex];
    if (currentPageIndex < book.pages.length - 1) {
      currentPageIndex++;
      updatePage();
    }
  }

  function prevPage() {
    if (currentPageIndex > 0) {
      currentPageIndex--;
      updatePage();
    }
  }

  // --- ٹچ اور انگلی سے سوائپ (Touch Swipe) ---
  const swipeContainer = document.getElementById('swipeArea');
  let startX = 0;
  let endX = 0;

  swipeContainer.addEventListener('touchstart', e => {
    startX = e.changedTouches[0].screenX;
  }, {passive: true});

  swipeContainer.addEventListener('touchend', e => {
    endX = e.changedTouches[0].screenX;
    handleSwipe();
  }, {passive: true});

  function handleSwipe() {
    const threshold = 40;
    const isRtl = currentLang === 'ur';

    if (startX - endX > threshold) {
      isRtl ? nextPage() : prevPage();
    } else if (endX - startX > threshold) {
      isRtl ? prevPage() : nextPage();
    }
  }

  // --- اسکرین شاٹ پروٹیکشن ---
  document.addEventListener('contextmenu', e => e.preventDefault());

  document.addEventListener('keydown', e => {
    if (
      e.key === 'PrintScreen' || 
      (e.ctrlKey && e.key === 'p') || 
      (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'S' || e.key === 'C')) ||
      (e.metaKey && e.shiftKey && (e.key === '3' || e.key === '4' || e.key === '5'))
    ) {
      e.preventDefault();
      alert('حفاظتی وجوہات کی بناء پر اسکرین شاٹ کی اجازت نہیں ہے۔');
    }
  });

  window.addEventListener('blur', () => {
    document.body.classList.add('blur-protected');
  });

  window.addEventListener('focus', () => {
    document.body.classList.remove('blur-protected');
  });

  // 1. ابتدائی چیک
  detectBlogLanguage();

  // 2. اگر بلاگ میں زبان تبدیل کرنے کے لیے سوئچر پر کلک کیا جائے تو فوراً زبان اپ ڈیٹ ہوگی
  const observer = new MutationObserver(() => {
    detectBlogLanguage();
  });

  observer.observe(document.documentElement, { attributes: true, attributeFilter: ['lang', 'dir', 'class'] });
  observer.observe(document.body, { attributes: true, attributeFilter: ['class'] });

  // 3. مسلسل چیک (ہر 1 سیکنڈ بعد تاکہ گوگل ٹرانسلیٹ کی تبدیلی فوراً مل جائے)
  setInterval(detectBlogLanguage, 1000);
</script>

</body>
</html>
