<!DOCTYPE html>
<html lang="ur" dir="rtl" id="htmlTag">
<head> 
   <link rel="stylesheet" href="style.css?v=0.1">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title id="docTitle">آن لائن کتب خانہ - عطاء الرحمٰن عطاء</title>

  <!-- PDF.js لائبریری -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

  <!-- Firebase Database SDK (Realtime Database Integration) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    @media print { body { display: none !important; } }

    body {
      background-color: #f4f0eb;
      margin: 0;
      padding: 0;
      font-family: 'Noto Nastaliq Urdu', Arial, sans-serif;
      direction: rtl;
      text-align: right;
      color: #1c3829;
      user-select: none;
      -webkit-user-select: none;
      overflow-x: hidden;
    }

    .books-page-wrapper {
      max-width: 900px;
      margin: 20px auto;
      padding: 0 20px;
      transition: filter 0.1s ease;
    }

    .books-nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      gap: 10px;
      flex-wrap: wrap;
    }

    .nav-btn {
      background: #1c3829;
      color: #ffffff;
      padding: 8px 16px;
      border-radius: 6px;
      text-decoration: none;
      border: none;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .nav-btn:hover { background: #b89762; }
    .btn-danger { background: #a33; }
    .btn-danger:hover { background: #700; }
    .btn-gold { background: #b89762; }
    .btn-gold:hover { background: #1c3829; }

    .admin-panel {
      background: #ffffff;
      border: 1px solid #e2dad0;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 25px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal-box {
      background: #fff;
      padding: 25px;
      border-radius: 12px;
      width: 90%;
      max-width: 360px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.2);
    }

    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
    .form-group input {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 14px;
    }

    .books-header-title {
      text-align: center;
      margin-bottom: 30px;
      background: #ffffff;
      padding: 25px;
      border-radius: 12px;
      border: 1px solid #e2dad0;
    }

    .books-grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 25px;
    }

    .book-card-item {
      background: #ffffff;
      border: 1px solid #e2dad0;
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.02);
      position: relative;
    }

    .book-card-item:hover { border-color: #b89762; }
    .book-cover-box { cursor: pointer; }
    .book-cover-box img {
      width: 100%;
      height: 280px;
      object-fit: cover;
      border-radius: 6px;
      margin-bottom: 12px;
      pointer-events: none;
    }

    .delete-btn {
      margin-top: 10px;
      width: 100%;
      justify-content: center;
    }

    .secure-book-container {
      background: #ffffff;
      border: 1px solid #e2dad0;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      position: relative;
      overflow: hidden;
      touch-action: none;
    }

    .secure-book-container:fullscreen {
      background: #f4f0eb;
      padding: 10px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .book-page-wrapper {
      position: relative;
      display: inline-block;
      max-width: 100%;
      margin: 0 auto;
      overflow: hidden;
    }

    .book-page-view {
      position: relative;
      display: inline-block;
      transform-origin: center center;
      transition: transform 0.05s ease-out;
      will-change: transform;
    }

    .book-page-view canvas {
      max-width: 100%;
      height: auto;
      max-height: 600px;
      border: 1px solid #eee;
      pointer-events: none;
      display: block;
    }

    .single-center-watermark {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(-30deg);
      font-size: 52px;
      font-weight: bold;
      color: rgba(0, 70, 160, 0.18);
      pointer-events: none;
      z-index: 5;
      white-space: nowrap;
      user-select: none;
      width: 100%;
      text-align: center;
    }

    .screenshot-protection-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(50px);
      -webkit-backdrop-filter: blur(50px);
      z-index: 99999;
      overflow: hidden;
      justify-content: center;
      align-items: center;
    }

    .watermark-500-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-around;
      align-content: space-around;
      width: 150%;
      height: 150%;
      transform: rotate(-25deg);
    }

    .watermark-500-item {
      font-size: 13px;
      font-weight: bold;
      color: rgba(0, 102, 204, 0.7);
      margin: 10px 14px;
      white-space: nowrap;
    }

    body.blur-protected .screenshot-protection-overlay {
      display: flex !important;
    }

    body.blur-protected .books-page-wrapper {
      filter: blur(100px) !important;
    }

    .book-controls-bar {
      margin-top: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .page-input-box {
      width: 50px;
      text-align: center;
      padding: 4px;
      border: 1px solid #b89762;
      border-radius: 4px;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div class="screenshot-protection-overlay" id="protectionOverlay">
  <div class="watermark-500-grid" id="watermark500Grid"></div>
</div>

<div class="books-page-wrapper">
  
  <div class="books-nav-bar">
    <a href="https://attaurrehman-atta.blogspot.com/p/home.html" class="nav-btn" id="homeBtn">صفحہ اول (Home)</a>
    
    <div id="adminNavControls" style="display: none;">
      <button class="nav-btn btn-gold" onclick="toggleUploadPanel()">+ کتاب اپلوڈ کریں</button>
      <button class="nav-btn" onclick="toggleSettingsPanel()">⚙ سیٹنگز</button>
      <button class="nav-btn btn-danger" onclick="adminLogout()">لاگ آؤٹ</button>
    </div>

    <div>
      <button class="nav-btn" id="backToLibBtn" onclick="closeBook()" style="display: none;">← تمام کتب</button>
    </div>
  </div>

  <div id="loginModal" class="modal-overlay" style="display: none;">
    <div class="modal-box">
      <h3 style="margin-top:0; color:#1c3829; text-align:center;">ایڈمن لاگ ان</h3>
      <div class="form-group">
        <label>یوزر نیم (Username):</label>
        <input type="text" id="loginUser" placeholder="یوزر نیم درج کریں">
      </div>
      <div class="form-group">
        <label>پاسورڈ (Password):</label>
        <input type="password" id="loginPass" placeholder="پاسورڈ درج کریں">
      </div>
      <div style="display:flex; justify-content:space-between; gap:10px;">
        <button class="nav-btn" onclick="processLogin()">لاگ ان کریں</button>
        <button class="nav-btn btn-danger" onclick="cancelLogin()">منسوخ</button>
      </div>
    </div>
  </div>

  <div id="uploadPanel" class="admin-panel" style="display: none;">
    <h3>نئی کتاب اپلوڈ کریں</h3>
    <div class="form-group">
      <label>کتاب کا نام (اردو):</label>
      <input type="text" id="bookTitleUr" placeholder="مثال: تحقیقی مقالات">
    </div>
    <div class="form-group">
      <label>کتاب کا نام (English):</label>
      <input type="text" id="bookTitleEn" placeholder="Example: Research Papers">
    </div>
    <div class="form-group">
      <label>کتاب کے کور کی تصویر کا لنک (Cover Image URL):</label>
      <input type="text" id="coverUrlInput" placeholder="https://example.com/cover.jpg">
    </div>
    <div class="form-group">
      <label>کتاب کی پی ڈی ایف فائل کا لنک (PDF File URL):</label>
      <input type="text" id="pdfUrlInput" placeholder="https://example.com/book.pdf">
    </div>
    <button class="nav-btn" id="saveBookBtn" onclick="saveNewBookFast()">محفوظ کریں</button>
    <button class="nav-btn btn-danger" onclick="toggleUploadPanel()">بند کریں</button>
  </div>

  <div id="settingsPanel" class="admin-panel" style="display: none;">
    <h3>یوزر نیم اور پاسورڈ تبدیل کریں</h3>
    <div class="form-group">
      <label>نیا یوزر نیم (New Username):</label>
      <input type="text" id="newUsername" placeholder="نیا یوزر نیم لکھیں">
    </div>
    <div class="form-group">
      <label>نیا پاسورڈ (New Password):</label>
      <input type="password" id="newPassword" placeholder="نیا پاسورڈ لکھیں">
    </div>
    <button class="nav-btn" onclick="updateCredentials()">سیٹنگز اپ ڈیٹ کریں</button>
    <button class="nav-btn btn-danger" onclick="toggleSettingsPanel()">بند کریں</button>
  </div>

  <div id="libraryView">
    <div class="books-header-title">
      <h1 id="libTitle">آن لائن کتب خانہ</h1>
      <p id="libSubtitle">مطالعہ کے لیے نیچے دی گئی کتب میں سے کسی کتاب پر کلک کریں</p>
    </div>
    <div class="books-grid-container" id="booksGrid"></div>
  </div>

  <div id="readerView" style="display: none;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
      <h2 id="activeBookTitle" style="font-size: 20px; color: #1c3829; margin: 0;">کتاب کا نام</h2>
      <button class="nav-btn" onclick="toggleFullScreen()">⤢ فل سکرین</button>
    </div>

    <div class="secure-book-container" id="swipeArea">
      <div class="book-page-wrapper">
        <div class="book-page-view" id="pageViewer"></div>
        <div class="single-center-watermark">عطاء لائبریری</div>
      </div>
      
      <div class="book-controls-bar">
        <button class="nav-btn" id="prevBtn" onclick="prevPage()">← پچھلا</button>

        <div style="font-size: 14px; font-weight: bold;">
          صفحہ <input type="number" id="pageInput" class="page-input-box" min="1" onchange="jumpToPage(this.value)"> 
          / <span id="totalPages">1</span>
        </div>

        <button class="nav-btn" id="nextBtn" onclick="nextPage()">اگلا →</button>
      </div>
    </div>
  </div>

</div>

<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

  // --- آن لائن ریئل ٹائم ڈیٹا بیس کنفیگریشن ---
  const firebaseConfig = {
    databaseURL: "https://mylibrary-books-default-rtdb.firebaseio.com"
  };
  firebase.initializeApp(firebaseConfig);
  const database = firebase.database();

  let adminCreds = JSON.parse(localStorage.getItem('adminCredentials')) || {
    username: "admin",
    password: "1234"
  };

  let currentLang = 'ur';
  let activeBookList = [];
  let currentBookIndex = 0;
  let currentPageIndex = 1;
  let pdfDoc = null;

  function build500WatermarkGrid() {
    const grid = document.getElementById('watermark500Grid');
    grid.innerHTML = '';
    for (let i = 0; i < 500; i++) {
      const item = document.createElement('span');
      item.className = 'watermark-500-item';
      item.innerText = 'عطاء لائبریری';
      grid.appendChild(item);
    }
  }
  build500WatermarkGrid();

  function checkHashAndAuth() {
    const currentHash = window.location.hash.toLowerCase();
    const isHashAdmin = (currentHash === '#admin');
    const isLoggedInSession = sessionStorage.getItem('isAdminLoggedIn') === 'true';

    if (isHashAdmin) {
      if (isLoggedInSession) {
        document.getElementById('adminNavControls').style.display = 'inline-flex';
        document.getElementById('loginModal').style.display = 'none';
      } else {
        document.getElementById('adminNavControls').style.display = 'none';
        document.getElementById('loginModal').style.display = 'flex';
      }
    } else {
      sessionStorage.removeItem('isAdminLoggedIn');
      document.getElementById('adminNavControls').style.display = 'none';
      document.getElementById('uploadPanel').style.display = 'none';
      document.getElementById('settingsPanel').style.display = 'none';
      document.getElementById('loginModal').style.display = 'none';
    }
  }

  window.addEventListener('hashchange', checkHashAndAuth);
  window.addEventListener('load', checkHashAndAuth);

  function processLogin() {
    const u = document.getElementById('loginUser').value;
    const p = document.getElementById('loginPass').value;

    if (u === adminCreds.username && p === adminCreds.password) {
      sessionStorage.setItem('isAdminLoggedIn', 'true');
      alert('لاگ ان کامیاب رہا!');
      checkHashAndAuth();
      renderLibrary();
    } else {
      alert('غلط یوزر نیم یا پاسورڈ!');
    }
  }

  function cancelLogin() {
    window.location.hash = '';
    checkHashAndAuth();
  }

  function adminLogout() {
    sessionStorage.removeItem('isAdminLoggedIn');
    window.location.hash = '';
    alert('آپ لاگ آؤٹ ہو چکے ہیں!');
    checkHashAndAuth();
    renderLibrary();
  }

  function toggleUploadPanel() {
    const p = document.getElementById('uploadPanel');
    document.getElementById('settingsPanel').style.display = 'none';
    p.style.display = p.style.display === 'none' ? 'block' : 'none';
  }

  function toggleSettingsPanel() {
    const p = document.getElementById('settingsPanel');
    document.getElementById('uploadPanel').style.display = 'none';
    if (p.style.display === 'none') {
      document.getElementById('newUsername').value = adminCreds.username;
      document.getElementById('newPassword').value = adminCreds.password;
      p.style.display = 'block';
    } else {
      p.style.display = 'none';
    }
  }

  function updateCredentials() {
    const newU = document.getElementById('newUsername').value;
    const newP = document.getElementById('newPassword').value;

    if (!newU || !newP) {
      alert('یوزر نیم اور پاسورڈ خالی نہیں ہو سکتے!');
      return;
    }

    adminCreds.username = newU;
    adminCreds.password = newP;
    localStorage.setItem('adminCredentials', JSON.stringify(adminCreds));
    alert('یوزر نیم اور پاسورڈ کامیابی سے تبدیل ہو گیا!');
    toggleSettingsPanel();
  }

  function saveNewBookFast() {
    const titleUr = document.getElementById('bookTitleUr').value.trim();
    const titleEn = document.getElementById('bookTitleEn').value.trim();
    const coverUrl = document.getElementById('coverUrlInput').value.trim();
    const pdfUrl = document.getElementById('pdfUrlInput').value.trim();

    if (!titleUr) { alert('کتاب کا نام لکھنا ضروری ہے'); return; }
    if (!pdfUrl) { alert('پی ڈی ایف فائل کا لنک (URL) فراہم کریں'); return; }

    const saveBtn = document.getElementById('saveBookBtn');
    saveBtn.innerText = 'محفوظ ہو رہا ہے...';
    saveBtn.disabled = true;

    const newBookRef = database.ref('books').push();
    newBookRef.set({
      titleUr: titleUr,
      titleEn: titleEn || titleUr,
      cover: coverUrl || 'https://via.placeholder.com/300x400?text=No+Cover',
      pdfUrl: pdfUrl
    }).then(() => {
      alert('کتاب تمام ڈیوائسز کے لیے کامیابی سے اپلوڈ ہو گئی!');
      saveBtn.innerText = 'محفوظ کریں';
      saveBtn.disabled = false;
      document.getElementById('bookTitleUr').value = '';
      document.getElementById('bookTitleEn').value = '';
      document.getElementById('pdfUrlInput').value = '';
      document.getElementById('coverUrlInput').value = '';
      toggleUploadPanel();
    }).catch((err) => {
      alert('ایرر: ' + err.message);
      saveBtn.innerText = 'محفوظ کریں';
      saveBtn.disabled = false;
    });
  }

  // آن لائن ڈیٹا بیس سے کتابیں لوڈ اور ریئل ٹائم سنگکرونائز کرنا
  function renderLibrary() {
    database.ref('books').on('value', (snapshot) => {
      const grid = document.getElementById('booksGrid');
      grid.innerHTML = '';
      activeBookList = [];

      const data = snapshot.val();
      if (!data) {
        grid.innerHTML = `<p style="text-align:center; grid-column: 1/-1;">کوئی کتاب موجود نہیں ہے۔</p>`;
        return;
      }

      const isAdminLoggedIn = sessionStorage.getItem('isAdminLoggedIn') === 'true';
      const isHashAdmin = window.location.hash.toLowerCase() === '#admin';

      Object.keys(data).forEach((key) => {
        const book = data[key];
        book.dbKey = key;
        activeBookList.push(book);
        const index = activeBookList.length - 1;

        const card = document.createElement('div');
        card.className = 'book-card-item';
        
        let deleteBtnHTML = '';
        if (isAdminLoggedIn && isHashAdmin) {
          deleteBtnHTML = `<button class="nav-btn btn-danger delete-btn" onclick="deleteBook('${key}')">🗑 ڈیلیٹ کریں</button>`;
        }

        card.innerHTML = `
          <div class="book-cover-box" onclick="openBook(${index})">
            <img src="${book.cover}" alt="Book Cover" onerror="this.src='https://via.placeholder.com/300x400?text=No+Cover'">
            <h3>${currentLang === 'ur' ? book.titleUr : book.titleEn}</h3>
          </div>
          ${deleteBtnHTML}
        `;
        grid.appendChild(card);
      });
    });
  }

  function deleteBook(key) {
    if (confirm("کیا آپ واقعی اس کتاب کو تمام موبائلز سے ڈیلیٹ کرنا چاہتے ہیں؟")) {
      database.ref('books/' + key).remove().then(() => {
        alert("کتاب کامیابی سے ڈیلیٹ کر دی گئی!");
      });
    }
  }

  async function openBook(index) {
    currentBookIndex = index;
    currentPageIndex = 1;
    resetZoomAndPosition();
    const book = activeBookList[index];

    document.getElementById('libraryView').style.display = 'none';
    document.getElementById('readerView').style.display = 'block';
    document.getElementById('backToLibBtn').style.display = 'inline-flex';
    document.getElementById('activeBookTitle').innerText = currentLang === 'ur' ? book.titleUr : book.titleEn;

    try {
      const loadingTask = pdfjsLib.getDocument(book.pdfUrl);
      pdfDoc = await loadingTask.promise;
      document.getElementById('totalPages').innerText = pdfDoc.numPages;
      renderPdfPage(currentPageIndex);
    } catch (error) {
      alert("پی ڈی ایف فائل لوڈ کرنے میں مسئلہ پیش آ رہا ہے: " + error.message);
    }
  }

  async function renderPdfPage(num) {
    const page = await pdfDoc.getPage(num);
    const viewport = page.getViewport({ scale: 1.5 });

    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    canvas.height = viewport.height;
    canvas.width = viewport.width;

    const viewer = document.getElementById('pageViewer');
    viewer.innerHTML = '';
    viewer.appendChild(canvas);

    await page.render({ canvasContext: ctx, viewport: viewport }).promise;
    document.getElementById('pageInput').value = num;
    resetZoomAndPosition();
  }

  function jumpToPage(val) {
    let pageNum = parseInt(val);
    let max = pdfDoc ? pdfDoc.numPages : 1;
    
    if (pageNum >= 1 && pageNum <= max) {
      currentPageIndex = pageNum;
      renderPdfPage(currentPageIndex);
    }
  }

  function nextPage() {
    if (currentPageIndex < pdfDoc.numPages) {
      currentPageIndex++;
      renderPdfPage(currentPageIndex);
    }
  }

  function prevPage() {
    if (currentPageIndex > 1) {
      currentPageIndex--;
      renderPdfPage(currentPageIndex);
    }
  }

  function toggleFullScreen() {
    const container = document.getElementById('swipeArea');
    if (!document.fullscreenElement) {
      container.requestFullscreen().catch(err => alert("فل سکرین فعال نہیں ہو سکی"));
    } else {
      document.exitFullscreen();
    }
  }

  function closeBook() {
    document.getElementById('readerView').style.display = 'none';
    document.getElementById('libraryView').style.display = 'block';
    document.getElementById('backToLibBtn').style.display = 'none';
  }

  const swipeContainer = document.getElementById('swipeArea');
  const pageViewer = document.getElementById('pageViewer');

  let currentScale = 1.0;
  let posX = 0, posY = 0;
  let startX = 0, startY = 0;
  let initialPinchDistance = null;
  let isDragging = false;

  function updateTransform() {
    pageViewer.style.transform = `translate(${posX}px, ${posY}px) scale(${currentScale})`;
  }

  function resetZoomAndPosition() {
    currentScale = 1.0;
    posX = 0;
    posY = 0;
    updateTransform();
  }

  swipeContainer.addEventListener('touchstart', function(e) {
    if (e.touches.length === 1) {
      startX = e.touches[0].clientX - posX;
      startY = e.touches[0].clientY - posY;
      isDragging = true;
    } else if (e.touches.length === 2) {
      isDragging = false;
      initialPinchDistance = getPinchDistance(e);
    }
  }, { passive: true });

  swipeContainer.addEventListener('touchmove', function(e) {
    if (e.touches.length === 2 && initialPinchDistance) {
      const newDistance = getPinchDistance(e);
      const zoomFactor = newDistance / initialPinchDistance;
      
      let targetScale = currentScale * zoomFactor;
      if (targetScale >= 1.0 && targetScale <= 50.0) {
        currentScale = targetScale;
        updateTransform();
      }
      initialPinchDistance = newDistance;
    } else if (e.touches.length === 1 && isDragging) {
      if (currentScale > 1.05) {
        posX = e.touches[0].clientX - startX;
        posY = e.touches[0].clientY - startY;
        updateTransform();
      }
    }
  }, { passive: true });

  swipeContainer.addEventListener('touchend', function(e) {
    if (e.changedTouches.length === 1 && currentScale <= 1.05) {
      let endX = e.changedTouches[0].clientX;
      let diffX = (startX + posX) - endX;

      if (Math.abs(diffX) > 50) {
        if (diffX > 0) {
          nextPage();
        } else {
          prevPage();
        }
      }
    }
    isDragging = false;
    initialPinchDistance = null;
  });

  function getPinchDistance(e) {
    return Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
  }

  document.addEventListener('contextmenu', e => e.preventDefault());

  window.addEventListener('blur', () => {
    document.body.classList.add('blur-protected');
  });

  window.addEventListener('focus', () => {
    document.body.classList.remove('blur-protected');
  });

  window.addEventListener('keyup', (e) => {
    if (e.key === 'PrintScreen' || e.keyCode === 44) {
      document.body.classList.add('blur-protected');
      setTimeout(() => {
        document.body.classList.remove('blur-protected');
      }, 3000);
    }
  });

  renderLibrary();
</script>

</body>
</html>
