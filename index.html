<!DOCTYPE html>
<html lang="ur" dir="rtl" id="htmlTag">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="docTitle">آن لائن کتب خانہ - عطاء الرحمٰن عطاء</title>

  <!-- PDF.js لائبریری -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

  <style>
    @media print { body { display: none !important; } }
    .blur-protected { filter: blur(15px) !important; user-select: none !important; }

    body {
      background-color: #f4f0eb;
      margin: 0;
      padding: 0;
      font-family: 'Noto Nastaliq Urdu', Arial, sans-serif;
      direction: rtl;
      text-align: right;
      color: #1c3829;
      user-select: none;
    }

    .books-page-wrapper {
      max-width: 900px;
      margin: 20px auto;
      padding: 0 20px;
    }

    .books-nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      gap: 10px;
      flex-wrap: wrap;
    }

    .nav-btn {
      background: #1c3829;
      color: #ffffff;
      padding: 8px 16px;
      border-radius: 6px;
      text-decoration: none;
      border: none;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .nav-btn:hover { background: #b89762; }
    .btn-danger { background: #a33; }
    .btn-danger:hover { background: #700; }
    .btn-gold { background: #b89762; }
    .btn-gold:hover { background: #1c3829; }

    .admin-panel {
      background: #ffffff;
      border: 1px solid #e2dad0;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 25px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal-box {
      background: #fff;
      padding: 25px;
      border-radius: 12px;
      width: 90%;
      max-width: 360px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.2);
    }

    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
    .form-group input {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 14px;
    }

    .books-header-title {
      text-align: center;
      margin-bottom: 30px;
      background: #ffffff;
      padding: 25px;
      border-radius: 12px;
      border: 1px solid #e2dad0;
    }

    .books-grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 25px;
    }

    .book-card-item {
      background: #ffffff;
      border: 1px solid #e2dad0;
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.02);
    }

    .book-card-item:hover { border-color: #b89762; }
    .book-cover-box img {
      width: 100%;
      height: 280px;
      object-fit: cover;
      border-radius: 6px;
      margin-bottom: 12px;
      pointer-events: none;
    }

    .secure-book-container {
      background: #ffffff;
      border: 1px solid #e2dad0;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      touch-action: pan-y;
      position: relative;
    }

    .secure-book-container:fullscreen {
      background: #f4f0eb;
      padding: 10px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .book-page-view canvas, .book-page-view img {
      max-width: 100%;
      height: auto;
      max-height: 500px;
      border: 1px solid #eee;
      pointer-events: none;
    }

    .book-controls-bar {
      margin-top: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .page-input-box {
      width: 50px;
      text-align: center;
      padding: 4px;
      border: 1px solid #b89762;
      border-radius: 4px;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div class="books-page-wrapper">
  
  <!-- نیویگیشن بار -->
  <div class="books-nav-bar">
    <a href="https://attaurrehman-atta.blogspot.com/p/home.html" class="nav-btn" id="homeBtn">صفحہ اول (Home)</a>
    
    <!-- ایڈمن کنٹرولز (صرف لاگ ان کے بعد نظر آئیں گے) -->
    <div id="adminNavControls" style="display: none;">
      <button class="nav-btn btn-gold" onclick="toggleUploadPanel()">+ کتاب اپلوڈ کریں</button>
      <button class="nav-btn" onclick="toggleSettingsPanel()">⚙ سیٹنگز</button>
      <button class="nav-btn btn-danger" onclick="adminLogout()">لاگ آؤٹ</button>
    </div>

    <div>
      <button class="nav-btn" id="backToLibBtn" onclick="closeBook()" style="display: none;">← تمام کتب</button>
    </div>
  </div>

  <!-- لاگ ان پاپ اپ ماڈل (#admin کھولنے پر یہ فارم آئے گا) -->
  <div id="loginModal" class="modal-overlay" style="display: none;">
    <div class="modal-box">
      <h3 style="margin-top:0; color:#1c3829; text-align:center;">ایڈمن لاگ ان</h3>
      <div class="form-group">
        <label>یوزر نیم (Username):</label>
        <input type="text" id="loginUser" placeholder="یوزر نیم درج کریں">
      </div>
      <div class="form-group">
        <label>پاسورڈ (Password):</label>
        <input type="password" id="loginPass" placeholder="پاسورڈ درج کریں">
      </div>
      <div style="display:flex; justify-content:space-between; gap:10px;">
        <button class="nav-btn" onclick="processLogin()">لاگ ان کریں</button>
        <button class="nav-btn btn-danger" onclick="cancelLogin()">منسوخ</button>
      </div>
    </div>
  </div>

  <!-- ایڈمن اپلوڈ فارم -->
  <div id="uploadPanel" class="admin-panel" style="display: none;">
    <h3>نئی کتاب اپلوڈ کریں</h3>
    <div class="form-group">
      <label>کتاب کا نام (اردو):</label>
      <input type="text" id="bookTitleUr" placeholder="مثال: تحقیقی مقالات">
    </div>
    <div class="form-group">
      <label>کتاب کا نام (English):</label>
      <input type="text" id="bookTitleEn" placeholder="Example: Research Papers">
    </div>
    <div class="form-group">
      <label>کتاب کا کور (Cover Image):</label>
      <input type="file" id="coverFileInput" accept="image/*">
      <input type="text" id="coverUrlInput" placeholder="یا امیج کا لنک (URL) درج کریں" style="margin-top: 5px;">
    </div>
    <div class="form-group">
      <label>کتاب کی پی ڈی ایف (PDF File):</label>
      <input type="file" id="pdfFileInput" accept="application/pdf">
      <input type="text" id="pdfUrlInput" placeholder="یا پی ڈی ایف فائل کا لنک (URL) درج کریں" style="margin-top: 5px;">
    </div>
    <button class="nav-btn" onclick="saveNewBook()">محفوظ کریں</button>
    <button class="nav-btn btn-danger" onclick="toggleUploadPanel()">بند کریں</button>
  </div>

  <!-- ایڈمن سیٹنگز فارم (یوزر نیم اور پاسورڈ تبدیل کریں) -->
  <div id="settingsPanel" class="admin-panel" style="display: none;">
    <h3>یوزر نیم اور پاسورڈ تبدیل کریں</h3>
    <div class="form-group">
      <label>نیا یوزر نیم (New Username):</label>
      <input type="text" id="newUsername" placeholder="نیا یوزر نیم لکھیں">
    </div>
    <div class="form-group">
      <label>نیا پاسورڈ (New Password):</label>
      <input type="password" id="newPassword" placeholder="نیا پاسورڈ لکھیں">
    </div>
    <button class="nav-btn" onclick="updateCredentials()">سیٹنگز اپ ڈیٹ کریں</button>
    <button class="nav-btn btn-danger" onclick="toggleSettingsPanel()">بند کریں</button>
  </div>

  <!-- لائبریری ویو -->
  <div id="libraryView">
    <div class="books-header-title">
      <h1 id="libTitle">آن لائن کتب خانہ</h1>
      <p id="libSubtitle">مطالعہ کے لیے نیچے دی گئی کتب میں سے کسی کتاب پر کلک کریں</p>
    </div>
    <div class="books-grid-container" id="booksGrid"></div>
  </div>

  <!-- بک ریڈر -->
  <div id="readerView" style="display: none;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
      <h2 id="activeBookTitle" style="font-size: 20px; color: #1c3829; margin: 0;">کتاب کا نام</h2>
      <button class="nav-btn" onclick="toggleFullScreen()">⤢ فل سکرین</button>
    </div>

    <div class="secure-book-container" id="swipeArea">
      <div class="book-page-view" id="pageViewer"></div>
      
      <div class="book-controls-bar">
        <button class="nav-btn" id="prevBtn" onclick="prevPage()">← پچھلا</button>

        <div style="font-size: 14px; font-weight: bold;">
          صفحہ <input type="number" id="pageInput" class="page-input-box" min="1" onchange="jumpToPage(this.value)"> 
          / <span id="totalPages">1</span>
        </div>

        <button class="nav-btn" id="nextBtn" onclick="nextPage()">اگلا →</button>
      </div>
    </div>
  </div>

</div>

<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

  // یوزر نیم اور پاسورڈ اسٹور کرنا
  let adminCreds = JSON.parse(localStorage.getItem('adminCredentials')) || {
    username: "admin",
    password: "1234"
  };

  let currentLang = 'ur';
  let libraryBooks = JSON.parse(localStorage.getItem('myLibraryBooks')) || [
    {
      titleUr: "تحقیقی مقالات",
      titleEn: "Research Papers",
      cover: "https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?auto=format&fit=crop&w=400&q=80",
      type: "images",
      pages: ["https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?auto=format&fit=crop&w=800&q=80"]
    }
  ];

  let currentBookIndex = 0;
  let currentPageIndex = 1;
  let pdfDoc = null;

  // `#admin` کی موجودگی اور لاگ ان سٹیٹ چیک کرنا
  function checkHashAndAuth() {
    const isHashAdmin = window.location.hash === '#admin';
    const isLoggedIn = localStorage.getItem('isAdminLoggedIn') === 'true';

    if (isHashAdmin) {
      if (isLoggedIn) {
        document.getElementById('adminNavControls').style.display = 'inline-flex';
      } else {
        document.getElementById('loginModal').style.display = 'flex';
      }
    } else {
      document.getElementById('adminNavControls').style.display = 'none';
      document.getElementById('uploadPanel').style.display = 'none';
      document.getElementById('settingsPanel').style.display = 'none';
      document.getElementById('loginModal').style.display = 'none';
    }
  }

  // URL ہیش تبدیل ہونے پر خودکار چیک کریں
  window.addEventListener('hashchange', checkHashAndAuth);

  function processLogin() {
    const u = document.getElementById('loginUser').value;
    const p = document.getElementById('loginPass').value;

    if (u === adminCreds.username && p === adminCreds.password) {
      localStorage.setItem('isAdminLoggedIn', 'true');
      alert('لاگ ان کامیاب رہا!');
      document.getElementById('loginModal').style.display = 'none';
      checkHashAndAuth();
    } else {
      alert('غلط یوزر نیم یا پاسورڈ!');
    }
  }

  function cancelLogin() {
    history.pushState("", document.title, window.location.pathname + window.location.search);
    checkHashAndAuth();
  }

  function adminLogout() {
    localStorage.removeItem('isAdminLoggedIn');
    history.pushState("", document.title, window.location.pathname + window.location.search);
    alert('آپ لاگ آؤٹ ہو چکے ہیں!');
    checkHashAndAuth();
  }

  function toggleUploadPanel() {
    const p = document.getElementById('uploadPanel');
    document.getElementById('settingsPanel').style.display = 'none';
    p.style.display = p.style.display === 'none' ? 'block' : 'none';
  }

  function toggleSettingsPanel() {
    const p = document.getElementById('settingsPanel');
    document.getElementById('uploadPanel').style.display = 'none';
    if (p.style.display === 'none') {
      document.getElementById('newUsername').value = adminCreds.username;
      document.getElementById('newPassword').value = adminCreds.password;
      p.style.display = 'block';
    } else {
      p.style.display = 'none';
    }
  }

  function updateCredentials() {
    const newU = document.getElementById('newUsername').value;
    const newP = document.getElementById('newPassword').value;

    if (!newU || !newP) {
      alert('یوزر نیم اور پاسورڈ خالی نہیں ہو سکتے!');
      return;
    }

    adminCreds.username = newU;
    adminCreds.password = newP;
    localStorage.setItem('adminCredentials', JSON.stringify(adminCreds));
    alert('یوزر نیم اور پاسورڈ کامیابی سے تبدیل ہو گیا!');
    toggleSettingsPanel();
  }

  async function saveNewBook() {
    const titleUr = document.getElementById('bookTitleUr').value;
    const titleEn = document.getElementById('bookTitleEn').value;
    const coverFile = document.getElementById('coverFileInput').files[0];
    const coverUrl = document.getElementById('coverUrlInput').value;
    const pdfFile = document.getElementById('pdfFileInput').files[0];
    const pdfUrl = document.getElementById('pdfUrlInput').value;

    if (!titleUr) { alert('کتاب کا نام لکھنا ضروری ہے'); return; }

    let finalCover = coverUrl;
    if (coverFile) finalCover = await readFileAsDataURL(coverFile);

    let bookData = {
      titleUr: titleUr,
      titleEn: titleEn || titleUr,
      cover: finalCover || 'https://via.placeholder.com/300x400?text=No+Cover',
      type: 'pdf',
      pdfData: null
    };

    if (pdfFile) bookData.pdfData = await readFileAsDataURL(pdfFile);
    else if (pdfUrl) bookData.pdfData = pdfUrl;
    else { alert('پی ڈی ایف فائل یا لنک شامل کریں'); return; }

    libraryBooks.push(bookData);
    localStorage.setItem('myLibraryBooks', JSON.stringify(libraryBooks));
    alert('کتاب کامیابی سے اپلوڈ ہو گئی!');
    toggleUploadPanel();
    renderLibrary();
  }

  function readFileAsDataURL(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function renderLibrary() {
    const grid = document.getElementById('booksGrid');
    grid.innerHTML = '';
    
    libraryBooks.forEach((book, index) => {
      const card = document.createElement('div');
      card.className = 'book-card-item';
      card.onclick = () => openBook(index);
      card.innerHTML = `
        <div class="book-cover-box"><img src="${book.cover}" alt="Book Cover"></div>
        <h3>${currentLang === 'ur' ? book.titleUr : book.titleEn}</h3>
      `;
      grid.appendChild(card);
    });
  }

  async function openBook(index) {
    currentBookIndex = index;
    currentPageIndex = 1;
    const book = libraryBooks[index];

    document.getElementById('libraryView').style.display = 'none';
    document.getElementById('readerView').style.display = 'block';
    document.getElementById('backToLibBtn').style.display = 'inline-flex';
    document.getElementById('activeBookTitle').innerText = currentLang === 'ur' ? book.titleUr : book.titleEn;

    if (book.type === 'pdf' || book.pdfData) {
      const loadingTask = pdfjsLib.getDocument(book.pdfData);
      pdfDoc = await loadingTask.promise;
      document.getElementById('totalPages').innerText = pdfDoc.numPages;
      renderPdfPage(currentPageIndex);
    } else {
      pdfDoc = null;
      document.getElementById('totalPages').innerText = book.pages.length;
      renderImagePage();
    }
  }

  async function renderPdfPage(num) {
    const page = await pdfDoc.getPage(num);
    const viewport = page.getViewport({ scale: 1.5 });

    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    canvas.height = viewport.height;
    canvas.width = viewport.width;

    const viewer = document.getElementById('pageViewer');
    viewer.innerHTML = '';
    viewer.appendChild(canvas);

    await page.render({ canvasContext: ctx, viewport: viewport }).promise;
    document.getElementById('pageInput').value = num;
  }

  function renderImagePage() {
    const book = libraryBooks[currentBookIndex];
    const viewer = document.getElementById('pageViewer');
    viewer.innerHTML = `<img src="${book.pages[currentPageIndex - 1]}" alt="Page">`;
    document.getElementById('pageInput').value = currentPageIndex;
  }

  function jumpToPage(val) {
    let pageNum = parseInt(val);
    let max = pdfDoc ? pdfDoc.numPages : libraryBooks[currentBookIndex].pages.length;
    
    if (pageNum >= 1 && pageNum <= max) {
      currentPageIndex = pageNum;
      if (pdfDoc) renderPdfPage(currentPageIndex);
      else renderImagePage();
    }
  }

  function nextPage() {
    let max = pdfDoc ? pdfDoc.numPages : libraryBooks[currentBookIndex].pages.length;
    if (currentPageIndex < max) {
      currentPageIndex++;
      if (pdfDoc) renderPdfPage(currentPageIndex);
      else renderImagePage();
    }
  }

  function prevPage() {
    if (currentPageIndex > 1) {
      currentPageIndex--;
      if (pdfDoc) renderPdfPage(currentPageIndex);
      else renderImagePage();
    }
  }

  function toggleFullScreen() {
    const container = document.getElementById('swipeArea');
    if (!document.fullscreenElement) {
      container.requestFullscreen().catch(err => alert("فل سکرین فعال نہیں ہو سکی"));
    } else {
      document.exitFullscreen();
    }
  }

  function closeBook() {
    document.getElementById('readerView').style.display = 'none';
    document.getElementById('libraryView').style.display = 'block';
    document.getElementById('backToLibBtn').style.display = 'none';
  }

  document.addEventListener('contextmenu', e => e.preventDefault());
  window.addEventListener('blur', () => document.body.classList.add('blur-protected'));
  window.addEventListener('focus', () => document.body.classList.remove('blur-protected'));

  checkHashAndAuth();
  renderLibrary();
</script>

</body>
</html>
