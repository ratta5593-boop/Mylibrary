<!DOCTYPE html>
<html lang="ur" dir="rtl" id="htmlTag">
<head> 
   <link rel="stylesheet" href="style.css?v=0.1">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title id="docTitle">آن لائن کتب خانہ - عطاء الرحمٰن عطاء</title>

  <!-- PDF.js لائبریری -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>

  <style>
    @media print { body { display: none !important; } }

    body {
      background-color: #f4f0eb;
      margin: 0;
      padding: 0;
      font-family: 'Noto Nastaliq Urdu', Arial, sans-serif;
      direction: rtl;
      text-align: right;
      color: #1c3829;
      user-select: none;
      -webkit-user-select: none;
      overflow-x: hidden;
    }

    .books-page-wrapper {
      max-width: 900px;
      margin: 20px auto;
      padding: 0 20px;
    }

    .books-nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      gap: 10px;
      flex-wrap: wrap;
    }

    .nav-btn {
      background: #1c3829;
      color: #ffffff;
      padding: 8px 16px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
    }

    .nav-btn:hover { background: #b89762; }
    .btn-danger { background: #a33; }
    .btn-gold { background: #b89762; }

    .admin-panel {
      background: #ffffff;
      border: 1px solid #e2dad0;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 25px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
    .form-group input {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 14px;
    }

    .books-header-title {
      text-align: center;
      margin-bottom: 30px;
      background: #ffffff;
      padding: 25px;
      border-radius: 12px;
      border: 1px solid #e2dad0;
    }

    .books-grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 25px;
    }

    .book-card-item {
      background: #ffffff;
      border: 1px solid #e2dad0;
      border-radius: 12px;
      padding: 16px;
      text-align: center;
    }

    .book-cover-box { cursor: pointer; }
    .book-cover-box img {
      width: 100%;
      height: 280px;
      object-fit: cover;
      border-radius: 6px;
      margin-bottom: 12px;
    }

    .secure-book-container {
      background: #ffffff;
      border: 1px solid #e2dad0;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      position: relative;
    }

    .book-page-view canvas {
      max-width: 100%;
      height: auto;
      border: 1px solid #eee;
    }
  </style>
</head>
<body>

<div class="books-page-wrapper">
  <div class="books-nav-bar">
    <a href="https://attaurrehman-atta.blogspot.com/p/home.html" class="nav-btn">صفحہ اول (Home)</a>
    
    <div id="adminNavControls" style="display: none;">
      <button class="nav-btn btn-gold" onclick="toggleUploadPanel()">+ کتاب اپلوڈ کریں</button>
      <button class="nav-btn btn-danger" onclick="adminLogout()">لاگ آؤٹ</button>
    </div>

    <button class="nav-btn" id="backToLibBtn" onclick="closeBook()" style="display: none;">← تمام کتب</button>
  </div>

  <!-- موبائل سے اپلوڈ فارم -->
  <div id="uploadPanel" class="admin-panel" style="display: none;">
    <h3>موبائل سے نئی کتاب اپلوڈ کریں</h3>
    <div class="form-group">
      <label>کتاب کا نام (اردو):</label>
      <input type="text" id="bookTitleUr" placeholder="مثال: تحقیقی مقالات">
    </div>

    <div class="form-group">
      <label>کتاب کا کور (موبائل گیلری سے منتخب کریں):</label>
      <input type="file" id="coverFileInput" accept="image/*">
    </div>

    <div class="form-group">
      <label>پی ڈی ایف فائل (موبائل سے منتخب کریں):</label>
      <input type="file" id="pdfFileInput" accept="application/pdf">
    </div>

    <button class="nav-btn" id="saveBookBtn" onclick="uploadBookFromMobile()">آن لائن اپلوڈ کریں</button>
    <button class="nav-btn btn-danger" onclick="toggleUploadPanel()">بند کریں</button>
  </div>

  <div id="libraryView">
    <div class="books-header-title">
      <h1>آن لائن کتب خانہ</h1>
      <p>مطالعہ کے لیے نیچے دی گئی کتب میں سے کسی کتاب پر کلک کریں</p>
    </div>
    <div class="books-grid-container" id="booksGrid"></div>
  </div>

  <div id="readerView" style="display: none;">
    <h2 id="activeBookTitle">کتاب کا نام</h2>
    <div class="secure-book-container">
      <div id="pageViewer" class="book-page-view"></div>
      <div style="margin-top: 15px;">
        <button class="nav-btn" onclick="prevPage()">← پچھلا</button>
        <span id="pageInfo">1 / 1</span>
        <button class="nav-btn" onclick="nextPage()">اگلا →</button>
      </div>
    </div>
  </div>
</div>

<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

  // Firebase Config
  const firebaseConfig = {
    databaseURL: "https://mylibrary-books-default-rtdb.firebaseio.com",
    storageBucket: "mylibrary-books-default-rtdb.appspot.com"
  };
  firebase.initializeApp(firebaseConfig);
  const database = firebase.database();
  const storage = firebase.storage();

  let activeBookList = [];
  let currentBookIndex = 0;
  let currentPageIndex = 1;
  let pdfDoc = null;

  function toggleUploadPanel() {
    const p = document.getElementById('uploadPanel');
    p.style.display = p.style.display === 'none' ? 'block' : 'none';
  }

  // موبائل سے آن لائن اپلوڈ کرنے کا فنکشن
  async function uploadBookFromMobile() {
    const titleUr = document.getElementById('bookTitleUr').value.trim();
    const coverFile = document.getElementById('coverFileInput').files[0];
    const pdfFile = document.getElementById('pdfFileInput').files[0];

    if (!titleUr) { alert('کتاب کا نام لکھیں'); return; }
    if (!pdfFile) { alert('پی ڈی ایف فائل منتخب کریں'); return; }

    const saveBtn = document.getElementById('saveBookBtn');
    saveBtn.innerText = 'اپلوڈ ہو رہا ہے... (براہ کرم انتظار کریں)';
    saveBtn.disabled = true;

    try {
      // 1. پی ڈی ایف آن لائن اپلوڈ کریں
      const pdfRef = storage.ref('pdfs/' + Date.now() + '_' + pdfFile.name);
      const pdfSnapshot = await pdfRef.put(pdfFile);
      const pdfUrl = await pdfSnapshot.ref.getDownloadURL();

      // 2. کور آن لائن اپلوڈ کریں (اگر منتخب کیا گیا ہے)
      let coverUrl = 'https://via.placeholder.com/300x400?text=No+Cover';
      if (coverFile) {
        const coverRef = storage.ref('covers/' + Date.now() + '_' + coverFile.name);
        const coverSnapshot = await coverRef.put(coverFile);
        coverUrl = await coverSnapshot.ref.getDownloadURL();
      }

      // 3. ڈیٹا بیس میں محفوظ کریں
      await database.ref('books').push({
        titleUr: titleUr,
        cover: coverUrl,
        pdfUrl: pdfUrl
      });

      alert('کتاب کامیابی سے تمام ڈیوائسز کے لیے اپلوڈ ہو گئی!');
      saveBtn.innerText = 'آن لائن اپلوڈ کریں';
      saveBtn.disabled = false;
      toggleUploadPanel();

    } catch (error) {
      alert('اپلوڈ میں مسئلہ: ' + error.message);
      saveBtn.innerText = 'آن لائن اپلوڈ کریں';
      saveBtn.disabled = false;
    }
  }

  // ڈیٹا بیس سے کتب دکھانا
  function renderLibrary() {
    database.ref('books').on('value', (snapshot) => {
      const grid = document.getElementById('booksGrid');
      grid.innerHTML = '';
      activeBookList = [];

      const data = snapshot.val();
      if (!data) {
        grid.innerHTML = '<p style="text-align:center;">کوئی کتاب موجود نہیں ہے۔</p>';
        return;
      }

      Object.keys(data).forEach((key) => {
        const book = data[key];
        activeBookList.push(book);
        const index = activeBookList.length - 1;

        const card = document.createElement('div');
        card.className = 'book-card-item';
        card.innerHTML = `
          <div class="book-cover-box" onclick="openBook(${index})">
            <img src="${book.cover}" alt="Cover">
            <h3>${book.titleUr}</h3>
          </div>
        `;
        grid.appendChild(card);
      });
    });
  }

  async function openBook(index) {
    currentBookIndex = index;
    currentPageIndex = 1;
    const book = activeBookList[index];

    document.getElementById('libraryView').style.display = 'none';
    document.getElementById('readerView').style.display = 'block';
    document.getElementById('backToLibBtn').style.display = 'inline-flex';
    document.getElementById('activeBookTitle').innerText = book.titleUr;

    const loadingTask = pdfjsLib.getDocument(book.pdfUrl);
    pdfDoc = await loadingTask.promise;
    renderPdfPage(currentPageIndex);
  }

  async function renderPdfPage(num) {
    const page = await pdfDoc.getPage(num);
    const viewport = page.getViewport({ scale: 1.5 });
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    canvas.height = viewport.height;
    canvas.width = viewport.width;

    const viewer = document.getElementById('pageViewer');
    viewer.innerHTML = '';
    viewer.appendChild(canvas);

    await page.render({ canvasContext: ctx, viewport: viewport }).promise;
    document.getElementById('pageInfo').innerText = `${num} / ${pdfDoc.numPages}`;
  }

  function nextPage() {
    if (currentPageIndex < pdfDoc.numPages) {
      currentPageIndex++;
      renderPdfPage(currentPageIndex);
    }
  }

  function prevPage() {
    if (currentPageIndex > 1) {
      currentPageIndex--;
      renderPdfPage(currentPageIndex);
    }
  }

  function closeBook() {
    document.getElementById('readerView').style.display = 'none';
    document.getElementById('libraryView').style.display = 'block';
    document.getElementById('backToLibBtn').style.display = 'none';
  }

  if (window.location.hash.toLowerCase() === '#admin') {
    document.getElementById('adminNavControls').style.display = 'inline-flex';
  }

  renderLibrary();
</script>

</body>
</html>
